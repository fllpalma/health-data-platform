# How dbt connects to the warehouse. No secrets here: values come from .env.
health:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', '127.0.0.1') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'health') }}"
      schema: analytics   # fallback schema; layers set their own (staging, ...)
      threads: 4

    # Phase 2b: same project, different warehouse. Run with: dbt build --target snowflake
    # Robot user with key-pair login (no password). Values come from .env.
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'not-set') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'not-set') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'HEALTH_TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'HEALTH_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'HEALTH') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', 'not-set') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', 'not-set') }}"
      schema: analytics
      threads: 4
