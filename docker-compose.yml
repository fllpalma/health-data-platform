# docker-compose.yml: the kitchen floor plan.
# Each "service" is one container. "profiles" group services by phase,
# so only what the current phase needs is running.
#
#   Start Phase 1 services:  docker compose --profile foundations up -d
#   Check they're healthy:   docker compose --profile foundations ps
#   Stop them (data kept):   docker compose --profile foundations down
#
# Passwords come from .env (gitignored). See .env.example.
#
#   Phase 3 (Airflow needs the lake + warehouse too):
#   docker compose --profile foundations --profile orchestration up -d --wait
#   Airflow UI: http://localhost:8080  (user: admin, password: AIRFLOW_ADMIN_PASSWORD in .env)
name: health-data-platform

# Shared settings for every Airflow container (YAML anchor, reused below with "<<: *airflow-common")
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: orchestration/airflow/Dockerfile
  image: health-platform/airflow:3.4.0
  profiles: ["orchestration"]
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor   # tasks run inside the scheduler (one machine, no Celery/Redis)
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # What our tasks need: warehouse + lake, reached by their service names on Docker's network
    POSTGRES_HOST: warehouse
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB:-health}
    LAKE_ENDPOINT: http://lake:8333
    LAKE_ACCESS_KEY: ${LAKE_ACCESS_KEY}
    LAKE_SECRET_KEY: ${LAKE_SECRET_KEY}
    DBT_PROJECT_DIR: /opt/project/transform
    DBT_PROFILES_DIR: /opt/project/transform
    # Airflow "connection" to the warehouse, referenced in DAGs by its id: health_warehouse
    AIRFLOW_CONN_HEALTH_WAREHOUSE: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@warehouse:5432/${POSTGRES_DB:-health}
  volumes:
    - ./dags:/opt/airflow/dags:ro          # the schedules (DAGs), read-only
    - ./src:/opt/project/src:ro            # our pipeline code (live, no rebuild needed)
    - ./transform:/opt/project/transform   # the dbt project (dbt writes target/ here)
    - ./data:/opt/project/data             # inbox + dlt work dir (stays on this Mac)
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  # 🍽️ The pantry: raw files stored exactly as delivered (S3-compatible data lake)
  lake:
    image: chrislusf/seaweedfs:4.53          # pinned version: same result on every machine
    profiles: ["foundations"]
    entrypoint: ["weed"]
    command:
      - mini                                 # all-in-one dev mode (storage + S3 + admin UI)
      - -dir=/data
      - -bucket=raw                          # create the "raw" bucket on startup
      - -admin.password=${LAKE_ADMIN_PASSWORD:?set LAKE_ADMIN_PASSWORD in .env}
    environment:
      # Standard S3 credential names, the same ones real AWS S3 uses
      AWS_ACCESS_KEY_ID: ${LAKE_ACCESS_KEY:?set LAKE_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${LAKE_SECRET_KEY:?set LAKE_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:8333:8333"                # S3 API (127.0.0.1 = reachable from this Mac only)
      - "127.0.0.1:12535:12535"              # Admin UI in the browser
    volumes:
      - lake-data:/data                      # files survive container restarts
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g                         # stay well inside Docker's 12 GB budget
    restart: "no"                          # on demand only: never auto-start with Docker

  # 🍽️ The organised shelves: tables you can query (data warehouse)
  warehouse:
    image: postgres:18.7
    profiles: ["foundations"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-health}
    ports:
      - "127.0.0.1:5432:5432"                # Mac-only, never exposed to the network
    volumes:
      - warehouse-data:/var/lib/postgresql   # Postgres 18+ layout
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
    restart: "no"                          # on demand only: never auto-start with Docker

  # ===================== Phase 3: orchestration (Airflow) =====================
  # 🍽️ The head chef's schedule.

  airflow-db:                                # Airflow's own logbook (separate from our warehouse)
    image: postgres:18.7
    profiles: ["orchestration"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m
    restart: "no"                          # on demand only: never auto-start with Docker

  airflow-init:                              # one-off: create/upgrade Airflow's tables + the admin user
    <<: *airflow-common
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        (airflow users create --username admin --password "$${AIRFLOW_ADMIN_PASSWORD}"
        --firstname Admin --lastname User --role Admin --email admin@example.com || true)
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
    restart: "no"

  airflow-apiserver:                         # web UI + API (the screen on the office wall)
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on: &after-init
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1536m
    restart: "no"                          # on demand only: never auto-start with Docker

  airflow-scheduler:                         # decides what runs when; with LocalExecutor it also runs tasks
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on: *after-init
    deploy:
      resources:
        limits:
          memory: 2g
    restart: "no"                          # on demand only: never auto-start with Docker

  airflow-dag-processor:                     # reads DAG files and keeps their definitions up to date
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 30s
    depends_on: *after-init
    deploy:
      resources:
        limits:
          memory: 1g
    restart: "no"                          # on demand only: never auto-start with Docker

  airflow-triggerer:                         # waits efficiently for external events (e.g. a file landing)
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 30s
    depends_on: *after-init
    deploy:
      resources:
        limits:
          memory: 768m
    restart: "no"                          # on demand only: never auto-start with Docker

volumes:
  lake-data:
  warehouse-data:
  airflow-db-data:
  airflow-logs:
