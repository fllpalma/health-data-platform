# pyproject.toml: the project's "ingredient list" and tool settings.
[project]
name = "health-platform"
version = "0.1.0"
description = "Personal health data platform (learning project)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.3",
    "dbt-core>=1.12.7",
    "dbt-postgres>=1.11.0",
    "dbt-snowflake>=1.12.5",
    "dlt[postgres,snowflake]>=1.32.0",
]

# Tools only developers need (not part of the pipeline itself)
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.5",
    "sqlfluff>=4.5.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

# --- ruff: code checker + formatter ------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = errors, I = tidy imports, B = likely bugs, UP = modern Python
select = ["E", "F", "I", "B", "UP"]

# --- pytest: test runner -----------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
