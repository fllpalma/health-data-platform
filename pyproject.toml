# pyproject.toml: the project's "ingredient list" and tool settings.
[project]
name = "health-platform"
version = "0.1.0"
description = "Personal health data platform (learning project)"
requires-python = ">=3.12"
dependencies = []

# Tools only developers need (not part of the pipeline itself)
[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

# --- ruff: code checker + formatter ------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = errors, I = tidy imports, B = likely bugs, UP = modern Python
select = ["E", "F", "I", "B", "UP"]

# --- pytest: test runner -----------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
